<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONTOUR // LIVE CODING SYSTEM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Brutalist color scheme */
      --bg-void: #0a0a0b;
      --bg-panel: #16161a;
      --bg-surface: #1f1f24;
      --bg-elevated: #28282e;

      /* Electric accents */
      --neon-cyan: #00fff5;
      --neon-magenta: #ff00ff;
      --neon-yellow: #ffff00;
      --neon-green: #00ff41;

      /* Functional colors */
      --text-primary: #e7e7ea;
      --text-secondary: #94949a;
      --text-tertiary: #5a5a62;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.15);

      /* Audio reactive */
      --pulse-active: var(--neon-cyan);
      --pulse-inactive: var(--bg-elevated);
    }

    @keyframes glitch {
      0%, 100% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
    }

    @keyframes pulse-glow {
      0%, 100% {
        box-shadow: 0 0 20px var(--neon-cyan),
                    0 0 40px var(--neon-cyan),
                    inset 0 0 20px rgba(0, 255, 245, 0.1);
      }
      50% {
        box-shadow: 0 0 40px var(--neon-cyan),
                    0 0 80px var(--neon-cyan),
                    inset 0 0 40px rgba(0, 255, 245, 0.2);
      }
    }

    @keyframes slide-in-left {
      from {
        opacity: 0;
        transform: translateX(-30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slide-in-up {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    body {
      font-family: 'DM Mono', monospace;
      background: var(--bg-void);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      line-height: 1.5;
    }

    /* Scanline effect */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(
        transparent 50%,
        rgba(0, 255, 245, 0.02) 50%
      );
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.3;
    }

    /* ========== HEADER ========== */
    .header {
      background: var(--bg-panel);
      border-bottom: 2px solid var(--neon-cyan);
      padding: 1.5rem 2rem;
      position: relative;
      animation: slide-in-up 0.6s ease-out;
    }

    .header::before {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg,
        var(--neon-cyan),
        var(--neon-magenta),
        var(--neon-yellow)
      );
      opacity: 0.5;
    }

    .header-content {
      max-width: 1800px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .logo {
      font-family: 'Archivo Black', sans-serif;
      font-size: 1.75rem;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      position: relative;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .nav-links {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border-strong);
      transition: all 0.2s;
      font-weight: 500;
    }

    .nav-links a:hover {
      color: var(--neon-cyan);
      border-color: var(--neon-cyan);
    }

    .nav-links a.active {
      color: var(--neon-cyan);
      border-color: var(--neon-cyan);
      background: rgba(0, 255, 245, 0.05);
    }

    .logo-text {
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-badge {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      font-weight: 400;
      background: var(--neon-cyan);
      color: var(--bg-void);
      padding: 0.25rem 0.5rem;
      border-radius: 2px;
      letter-spacing: 0.1em;
    }

    .transport-controls {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      background: var(--bg-surface);
      padding: 0.75rem 1.25rem;
      border: 1px solid var(--border-strong);
      position: relative;
      overflow: hidden;
    }

    .control-group::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 3px;
      height: 100%;
      background: var(--neon-cyan);
    }

    .control-group label {
      font-size: 0.75rem;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 500;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      font-size: 0.813rem;
      font-weight: 500;
      font-family: 'DM Mono', monospace;
      border: 2px solid var(--border-strong);
      cursor: pointer;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      color: var(--text-primary);
      background: var(--bg-elevated);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--neon-cyan), transparent);
      opacity: 0;
      transition: opacity 0.15s;
    }

    .btn:hover:not(:disabled)::before {
      opacity: 0.1;
    }

    .btn:hover:not(:disabled) {
      border-color: var(--neon-cyan);
      transform: translateY(-1px);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--bg-elevated);
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--neon-cyan);
      color: var(--bg-void);
    }

    .btn-success {
      background: var(--neon-green);
      color: var(--bg-void);
      border-color: var(--neon-green);
      font-weight: 500;
    }

    .btn-success:hover:not(:disabled) {
      filter: brightness(1.2);
    }

    .btn-icon {
      width: 44px;
      height: 44px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      border: 2px solid var(--border-strong);
    }

    .slider {
      width: 140px;
      height: 2px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      outline: none;
      -webkit-appearance: none;
      position: relative;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: var(--neon-cyan);
      border: 2px solid var(--bg-void);
      cursor: pointer;
      box-shadow: 0 0 10px var(--neon-cyan);
      transition: all 0.15s;
    }

    .slider::-webkit-slider-thumb:hover {
      box-shadow: 0 0 20px var(--neon-cyan);
      transform: scale(1.1);
    }

    .slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      background: var(--neon-cyan);
      border: 2px solid var(--bg-void);
      border-radius: 0;
      cursor: pointer;
      box-shadow: 0 0 10px var(--neon-cyan);
      transition: all 0.15s;
    }

    .slider::-moz-range-thumb:hover {
      box-shadow: 0 0 20px var(--neon-cyan);
      transform: scale(1.1);
    }

    .value-display {
      min-width: 3.5rem;
      text-align: right;
      font-weight: 500;
      font-size: 0.875rem;
      color: var(--neon-cyan);
      font-variant-numeric: tabular-nums;
    }

    /* ========== MAIN CONTAINER ========== */
    .main-container {
      max-width: 1800px;
      margin: 0 auto;
      padding: 2rem;
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 2rem;
      animation: slide-in-up 0.8s ease-out 0.2s both;
    }

    .grid-section {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .section-title {
      font-family: 'Archivo Black', sans-serif;
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      position: relative;
      display: inline-block;
    }

    .section-title::before {
      content: '//';
      position: absolute;
      left: -2rem;
      color: var(--neon-cyan);
      font-size: 1.2rem;
    }

    /* ========== PERFORMANCE GRID ========== */
    .performance-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.25rem;
      padding: 2rem;
      background: var(--bg-panel);
      border: 2px solid var(--border-strong);
      position: relative;
    }

    .performance-grid::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg,
        var(--neon-cyan),
        transparent 50%,
        var(--neon-magenta)
      );
    }

    .pad {
      aspect-ratio: 1;
      background: var(--bg-surface);
      border: 2px solid var(--border-strong);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 1.25rem;
      position: relative;
      overflow: hidden;
    }

    /* Corner accents */
    .pad::before,
    .pad::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      border: 2px solid var(--border-strong);
      transition: border-color 0.2s;
    }

    .pad::before {
      top: 0.5rem;
      left: 0.5rem;
      border-right: none;
      border-bottom: none;
    }

    .pad::after {
      bottom: 0.5rem;
      right: 0.5rem;
      border-left: none;
      border-top: none;
    }

    .pad:hover {
      border-color: var(--neon-cyan);
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 255, 245, 0.2);
    }

    .pad:hover::before,
    .pad:hover::after {
      border-color: var(--neon-cyan);
    }

    .pad.active {
      border-color: var(--neon-cyan);
      background: linear-gradient(135deg,
        rgba(0, 255, 245, 0.15),
        rgba(255, 0, 255, 0.1)
      );
      animation: pulse-glow 2s ease-in-out infinite;
    }

    .pad.active::before,
    .pad.active::after {
      border-color: var(--neon-cyan);
    }

    /* Animated background for active pads */
    .pad.active .pad-bg-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center,
        rgba(0, 255, 245, 0.2),
        transparent 70%
      );
      animation: pulse-glow 2s ease-in-out infinite;
    }

    .pad-icon {
      font-size: 2rem;
      filter: grayscale(0.3);
      transition: filter 0.2s;
    }

    .pad.active .pad-icon {
      filter: grayscale(0) drop-shadow(0 0 10px var(--neon-cyan));
    }

    .pad-name {
      font-size: 0.75rem;
      font-weight: 500;
      text-align: center;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }

    .pad.active .pad-name {
      color: var(--neon-cyan);
    }

    .pad-edit {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0.5rem;
      background: rgba(0, 0, 0, 0.9);
      border-top: 1px solid var(--border-strong);
      font-size: 0.625rem;
      font-weight: 500;
      color: var(--text-secondary);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s;
      cursor: pointer;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .pad:hover .pad-edit {
      opacity: 1;
      transform: translateY(0);
    }

    .pad-edit:hover {
      background: var(--bg-void);
      color: var(--neon-cyan);
    }

    /* ========== SIDEBAR ========== */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      animation: slide-in-left 0.8s ease-out 0.4s both;
    }

    .panel {
      background: var(--bg-panel);
      border: 2px solid var(--border-strong);
      padding: 1.5rem;
      position: relative;
    }

    .panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg,
        var(--neon-magenta),
        transparent
      );
    }

    .panel h3 {
      font-family: 'Archivo Black', sans-serif;
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .visualization {
      width: 100%;
      height: 200px;
      background: var(--bg-void);
      border: 1px solid var(--border-subtle);
      position: relative;
    }

    .visualization::after {
      content: 'WAVEFORM ANALYZER';
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      font-size: 0.625rem;
      color: var(--text-tertiary);
      letter-spacing: 0.1em;
    }

    /* ========== SHORTCUTS PANEL ========== */
    .shortcuts-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .shortcut-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem;
      background: var(--bg-surface);
      border-left: 2px solid var(--border-strong);
      transition: all 0.2s;
    }

    .shortcut-item:hover {
      background: var(--bg-elevated);
      border-left-color: var(--neon-cyan);
    }

    .shortcut-desc {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .shortcut-keys {
      display: flex;
      gap: 0.375rem;
    }

    .key-badge {
      background: var(--bg-void);
      border: 1px solid var(--border-strong);
      padding: 0.25rem 0.625rem;
      font-size: 0.688rem;
      font-weight: 500;
      color: var(--neon-cyan);
      min-width: 2rem;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* ========== MODAL ========== */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(10px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .modal.active {
      display: flex;
      animation: fade-in 0.2s ease-out;
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: var(--bg-panel);
      border: 2px solid var(--neon-cyan);
      width: 100%;
      max-width: 1000px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 255, 245, 0.3);
      animation: modal-slide-up 0.3s ease-out;
    }

    @keyframes modal-slide-up {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-header {
      padding: 1.5rem;
      border-bottom: 2px solid var(--border-strong);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-surface);
    }

    .modal-title {
      font-family: 'Archivo Black', sans-serif;
      font-size: 1.25rem;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      color: var(--neon-cyan);
    }

    .modal-close {
      width: 36px;
      height: 36px;
      background: var(--bg-elevated);
      border: 2px solid var(--border-strong);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .modal-close:hover {
      background: var(--neon-cyan);
      color: var(--bg-void);
      border-color: var(--neon-cyan);
    }

    .modal-body {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .editor-container {
      flex: 1;
      min-height: 400px;
      background: #1e1e1e;
    }

    .modal-footer {
      padding: 1.5rem;
      border-top: 2px solid var(--border-strong);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      background: var(--bg-surface);
    }

    .shortcut-hint {
      font-size: 0.75rem;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .shortcut-key {
      background: var(--bg-elevated);
      padding: 0.25rem 0.5rem;
      border: 1px solid var(--border-strong);
      font-family: 'DM Mono', monospace;
      color: var(--neon-cyan);
    }

    .modal-actions {
      display: flex;
      gap: 1rem;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 1400px) {
      .main-container {
        grid-template-columns: 1fr 350px;
      }
    }

    @media (max-width: 1200px) {
      .main-container {
        grid-template-columns: 1fr;
      }

      .sidebar {
        order: -1;
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: auto;
        display: grid;
      }
    }

    @media (max-width: 768px) {
      .header-content {
        flex-direction: column;
        gap: 1.5rem;
      }

      .transport-controls {
        width: 100%;
        justify-content: center;
      }

      .performance-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
        padding: 1.5rem;
      }

      .sidebar {
        grid-template-columns: 1fr;
      }

      .main-container {
        padding: 1.5rem;
        gap: 1.5rem;
      }
    }

    @media (max-width: 480px) {
      .logo {
        font-size: 1.25rem;
      }

      .logo-badge {
        font-size: 0.5rem;
      }

      .performance-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.75rem;
        padding: 1rem;
      }

      .pad {
        padding: 0.75rem;
      }

      .pad-icon {
        font-size: 1.5rem;
      }

      .pad-name {
        font-size: 0.65rem;
      }

      .section-title::before {
        content: '';
      }
    }

    /* ========== PAD BADGES ========== */
    .pad {
      position: relative;
    }

    .pad-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      font-size: 9px;
      padding: 3px 7px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 1px;
      pointer-events: none;
      max-width: calc(100% - 12px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
      z-index: 10;
    }

    .badge-synth {
      background: rgba(0, 255, 245, 0.15);
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
    }

    .badge-sample {
      background: rgba(255, 0, 255, 0.15);
      color: var(--neon-magenta);
      border: 1px solid var(--neon-magenta);
    }

    .pad.active .pad-badge {
      animation: badge-pulse 2s ease-in-out infinite;
    }

    @keyframes badge-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .pad.focused {
      outline: 2px solid var(--neon-cyan);
      outline-offset: 2px;
    }

    /* ========== LOADING PROGRESS ========== */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 10, 11, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      backdrop-filter: blur(4px);
    }

    .progress-container {
      width: 500px;
      max-width: 90vw;
      padding: 2.5rem;
      background: var(--bg-panel);
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 30px rgba(0, 255, 245, 0.4);
      animation: slide-in-up 0.3s ease-out;
    }

    .progress-status {
      font-size: 14px;
      text-align: center;
      margin-bottom: 1.5rem;
      color: var(--text-primary);
      font-weight: 500;
    }

    .progress-bar-outer {
      width: 100%;
      height: 10px;
      background: var(--bg-surface);
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
    }

    .progress-bar-inner {
      height: 100%;
      background: var(--neon-cyan);
      transition: width 0.3s ease;
      box-shadow: 0 0 15px var(--neon-cyan);
    }

    .loading-overlay.error .progress-container {
      border-color: var(--neon-magenta);
      box-shadow: 0 0 30px rgba(255, 0, 255, 0.4);
    }

    .loading-overlay.error .progress-bar-inner {
      background: var(--neon-magenta);
      box-shadow: 0 0 15px var(--neon-magenta);
    }

    .loading-overlay.success .progress-container {
      border-color: var(--neon-green);
      box-shadow: 0 0 30px rgba(0, 255, 65, 0.4);
    }

    .loading-overlay.success .progress-bar-inner {
      background: var(--neon-green);
      box-shadow: 0 0 15px var(--neon-green);
    }

    /* ========== INSTRUMENT SELECTOR MODAL ========== */
    .instrument-selector-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 10, 11, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      backdrop-filter: blur(4px);
    }

    .instrument-selector-content {
      width: 700px;
      max-width: 95vw;
      max-height: 90vh;
      background: var(--bg-panel);
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 40px rgba(0, 255, 245, 0.5);
      display: flex;
      flex-direction: column;
      animation: slide-in-up 0.3s ease-out;
    }

    .instrument-selector-header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border-strong);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .instrument-selector-header h2 {
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--neon-cyan);
      margin: 0;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 28px;
      cursor: pointer;
      line-height: 1;
      padding: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .close-btn:hover {
      color: var(--neon-cyan);
    }

    .current-instrument {
      padding: 1rem 2rem;
      background: var(--bg-surface);
      font-size: 13px;
      color: var(--text-secondary);
    }

    .search-container {
      padding: 1rem 2rem;
      background: var(--bg-surface);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .search-icon {
      font-size: 16px;
    }

    .search-input {
      flex: 1;
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 0.5rem 0.75rem;
      font-family: 'DM Mono', monospace;
      font-size: 13px;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--neon-cyan);
    }

    .library-selector-container {
      padding: 0.75rem 2rem;
      background: var(--bg-surface);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .library-select {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 0.35rem 0.5rem;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
    }

    .library-select:focus {
      outline: none;
      border-color: var(--neon-cyan);
    }

    .category-tabs {
      display: flex;
      gap: 0.5rem;
      padding: 1rem 2rem;
      background: var(--bg-elevated);
      overflow-x: auto;
      border-bottom: 1px solid var(--border-strong);
    }

    .category-tab {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 0.4rem 0.75rem;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .category-tab:hover {
      border-color: var(--neon-cyan);
      color: var(--text-primary);
    }

    .category-tab.active {
      background: var(--neon-cyan);
      color: var(--bg-void);
      border-color: var(--neon-cyan);
    }

    .instrument-list {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 0;
    }

    .instrument-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 2rem;
      cursor: pointer;
      transition: background 0.2s;
      border-left: 3px solid transparent;
    }

    .instrument-item:hover {
      background: var(--bg-elevated);
      border-left-color: var(--neon-cyan);
    }

    .instrument-checkbox {
      margin: 0;
      cursor: pointer;
    }

    .instrument-name {
      flex: 1;
      font-size: 13px;
      color: var(--text-primary);
    }

    .btn-preview {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 0.35rem 0.75rem;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-preview:hover {
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
    }

    .btn-preview:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-apply {
      background: var(--neon-cyan);
      border: none;
      color: var(--bg-void);
      width: 28px;
      height: 28px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .btn-apply:hover {
      background: var(--neon-green);
    }

    .no-results {
      padding: 3rem 2rem;
      text-align: center;
      color: var(--text-tertiary);
      font-size: 13px;
    }

    .instrument-selector-footer {
      padding: 1.5rem 2rem;
      border-top: 1px solid var(--border-strong);
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
    }

    .btn-secondary {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 0.5rem 1.5rem;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-secondary:hover {
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
    }

    /* ========== SAMPLE LIBRARY PANEL ========== */
    .sample-library-panel-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 10, 11, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      backdrop-filter: blur(4px);
    }

    .sample-library-panel-content {
      width: 600px;
      max-width: 95vw;
      max-height: 80vh;
      background: var(--bg-panel);
      border: 2px solid var(--neon-magenta);
      box-shadow: 0 0 40px rgba(255, 0, 255, 0.5);
      display: flex;
      flex-direction: column;
      animation: slide-in-up 0.3s ease-out;
    }

    .sample-library-panel-header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border-strong);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sample-library-panel-header h2 {
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--neon-magenta);
      margin: 0;
    }

    .library-status {
      padding: 1.5rem 2rem;
      background: var(--bg-surface);
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      font-size: 13px;
    }

    .status-row:last-child {
      margin-bottom: 0;
    }

    .status-label {
      color: var(--text-secondary);
    }

    .status-value {
      color: var(--text-primary);
      font-weight: 500;
    }

    .instruments-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 2rem;
    }

    .instruments-header {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      margin-bottom: 1rem;
    }

    .instruments-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .instrument-entry {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem;
      background: var(--bg-elevated);
      border-left: 3px solid var(--neon-magenta);
      font-size: 12px;
    }

    .instrument-icon {
      font-size: 14px;
    }

    .instrument-entry .instrument-name {
      flex: 1;
      color: var(--text-primary);
    }

    .instrument-status {
      color: var(--neon-green);
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 1px;
    }

    .instrument-size {
      color: var(--text-tertiary);
      font-size: 11px;
    }

    .no-instruments {
      padding: 3rem 0;
      text-align: center;
      color: var(--text-tertiary);
      font-size: 13px;
    }

    .library-actions {
      padding: 1.5rem 2rem;
      border-top: 1px solid var(--border-strong);
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
    }

    /* ========== UTILITY ANIMATIONS ========== */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-content">
      <div style="display: flex; align-items: center; gap: 2rem; flex-wrap: wrap;">
        <a href="/" style="text-decoration: none; color: inherit;">
          <div class="logo">
            <span class="logo-text">CONTOUR</span>
            <span class="logo-badge">LIVE</span>
          </div>
        </a>
        <nav class="nav-links">
          <a href="/">← Home</a>
          <a href="/performance.html" class="active">Contour Live</a>
          <a href="/prototype-samples.html">Sample Library</a>
        </nav>
      </div>

      <div class="transport-controls">
        <button id="demoBtn" class="btn btn-success">
          START PLAYGROUND
        </button>

        <button id="playBtn" class="btn" disabled>
          Play
        </button>

        <div class="control-group">
          <label for="bpmSlider">BPM</label>
          <input
            type="range"
            id="bpmSlider"
            class="slider"
            min="60"
            max="240"
            value="120"
            disabled
          />
          <span id="bpmValue" class="value-display">120</span>
        </div>

        <div class="control-group">
          <label for="volumeSlider">GAIN</label>
          <input
            type="range"
            id="volumeSlider"
            class="slider"
            min="-40"
            max="0"
            value="0"
            disabled
          />
          <span id="volumeValue" class="value-display">0dB</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-container">
    <!-- Performance Grid -->
    <div class="grid-section">
      <div class="section-header">
        <h2 class="section-title">Pattern Matrix</h2>
        <div style="display: flex; gap: 1rem;">
          <button id="toggleSamplesBtn" class="btn" disabled>
            🎹 Use Synths
          </button>
          <button id="clearAllBtn" class="btn btn-primary" disabled>
            Clear All
          </button>
        </div>
      </div>

      <div class="performance-grid" id="performanceGrid">
        <!-- Grid pads will be generated by JavaScript -->
      </div>

      <!-- Keyboard Shortcuts -->
      <div class="panel">
        <h3>Keyboard Shortcuts</h3>
        <div class="shortcuts-list">
          <div class="shortcut-item">
            <span class="shortcut-desc">Play/Pause</span>
            <div class="shortcut-keys">
              <span class="key-badge">Space</span>
            </div>
          </div>
          <div class="shortcut-item">
            <span class="shortcut-desc">Stop All</span>
            <div class="shortcut-keys">
              <span class="key-badge">Esc</span>
            </div>
          </div>
          <div class="shortcut-item">
            <span class="shortcut-desc">Trigger Pads</span>
            <div class="shortcut-keys">
              <span class="key-badge">1-4</span>
              <span class="key-badge">Q-R</span>
              <span class="key-badge">A-F</span>
              <span class="key-badge">Z-V</span>
            </div>
          </div>
          <div class="shortcut-item">
            <span class="shortcut-desc">Edit Pattern</span>
            <div class="shortcut-keys">
              <span class="key-badge">Shift</span>
              <span class="key-badge">+</span>
              <span class="key-badge">Key</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
      <!-- Visualization -->
      <div class="panel">
        <h3>Piano Roll</h3>
        <canvas id="waveformCanvas" class="visualization" width="368" height="144"></canvas>
      </div>
    </div>
  </div>

  <!-- Pattern Editor Modal -->
  <div id="editorModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="editorTitle">Edit Pattern</h3>
        <button class="modal-close" id="closeEditorBtn">×</button>
      </div>
      <div class="modal-body">
        <div id="monacoEditor" class="editor-container"></div>
      </div>
      <div class="modal-footer">
        <div class="shortcut-hint">
          Press <span class="shortcut-key">Cmd/Ctrl + Enter</span> to apply changes
        </div>
        <div class="modal-actions">
          <button class="btn" id="cancelEditorBtn">Cancel</button>
          <button class="btn btn-primary" id="applyEditorBtn">Apply Changes</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/performance.ts"></script>
</body>
</html>
