<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Library Prototype - Contour 2.0</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
      background: #0a0a0a;
      color: #00ff41;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      text-shadow: 0 0 10px #00ff41;
    }

    .subtitle {
      color: #888;
      margin-bottom: 30px;
      font-size: 0.9rem;
    }

    .section {
      background: #111;
      border: 2px solid #00ff41;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .section h2 {
      font-size: 1.3rem;
      margin-bottom: 15px;
      color: #00ff41;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    button {
      background: #000;
      border: 2px solid #00ff41;
      color: #00ff41;
      padding: 12px 24px;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }

    button:hover:not(:disabled) {
      background: #00ff41;
      color: #000;
      box-shadow: 0 0 20px #00ff41;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      padding: 10px;
      background: #000;
      border-left: 4px solid #00ff41;
      margin-bottom: 15px;
      font-size: 0.9rem;
    }

    .status.loading {
      border-color: #ffaa00;
      color: #ffaa00;
    }

    .status.error {
      border-color: #ff0000;
      color: #ff0000;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }

    .metric {
      background: #000;
      padding: 12px;
      border-radius: 4px;
      border: 1px solid #333;
    }

    .metric-label {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 5px;
    }

    .metric-value {
      font-size: 1.2rem;
      color: #00ff41;
      font-weight: bold;
    }

    .log {
      background: #000;
      padding: 15px;
      border-radius: 4px;
      max-height: 300px;
      overflow-y: auto;
      font-size: 0.85rem;
      font-family: 'Monaco', monospace;
    }

    .log-entry {
      margin-bottom: 5px;
      opacity: 0.8;
    }

    .log-entry.highlight {
      color: #ffaa00;
      opacity: 1;
    }

    .piano {
      display: flex;
      gap: 2px;
      margin-top: 15px;
      justify-content: center;
    }

    .key {
      width: 50px;
      height: 150px;
      background: #fff;
      border: 2px solid #000;
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 10px;
      color: #000;
      font-weight: bold;
      transition: all 0.1s;
    }

    .key:hover {
      background: #00ff41;
      transform: translateY(-2px);
    }

    .key:active {
      transform: translateY(2px);
      background: #00aa00;
    }

    .instrument-select {
      background: #000;
      border: 2px solid #00ff41;
      color: #00ff41;
      padding: 8px;
      font-family: inherit;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎵 Sample Library Prototype</h1>
    <p class="subtitle">Testing external sample library loading with soundfont-player</p>

    <div class="section">
      <h2>1. Load Instrument</h2>
      <div class="controls">
        <select id="instrumentSelect" class="instrument-select">
          <option value="acoustic_grand_piano">Acoustic Grand Piano</option>
          <option value="bright_acoustic_piano">Bright Acoustic Piano</option>
          <option value="electric_piano_1">Electric Piano 1</option>
          <option value="acoustic_bass">Acoustic Bass</option>
          <option value="violin">Violin</option>
          <option value="cello">Cello</option>
          <option value="flute">Flute</option>
          <option value="trumpet">Trumpet</option>
        </select>
        <button id="loadBtn">Load Instrument</button>
        <button id="unloadBtn" disabled>Unload All</button>
      </div>
      <div id="status" class="status">Click "Load Instrument" to start</div>
    </div>

    <div class="section">
      <h2>2. Play Notes</h2>
      <div class="controls">
        <button id="playScaleBtn" disabled>Play C Major Scale</button>
        <button id="playChordBtn" disabled>Play C Major Chord</button>
        <button id="playMelodyBtn" disabled>Play Simple Melody</button>
      </div>
      <div class="piano" id="piano"></div>
    </div>

    <div class="section">
      <h2>3. Performance Metrics</h2>
      <div class="metrics" id="metrics">
        <div class="metric">
          <div class="metric-label">Load Time</div>
          <div class="metric-value" id="loadTime">--</div>
        </div>
        <div class="metric">
          <div class="metric-label">Instruments Loaded</div>
          <div class="metric-value" id="instrumentCount">0</div>
        </div>
        <div class="metric">
          <div class="metric-label">Memory (Estimate)</div>
          <div class="metric-value" id="memoryUsage">--</div>
        </div>
        <div class="metric">
          <div class="metric-label">Status</div>
          <div class="metric-value" id="statusMetric">Idle</div>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>4. Event Log</h2>
      <div class="log" id="log"></div>
    </div>
  </div>

  <script type="module" src="/src/prototype-samples.ts"></script>
</body>
</html>
