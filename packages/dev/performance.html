<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contour 2.0 - Live Performance Interface</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0e27;
      --bg-secondary: #1a1f3a;
      --bg-tertiary: #2a2f4a;
      --accent-primary: #667eea;
      --accent-secondary: #764ba2;
      --accent-active: #4ade80;
      --text-primary: #ffffff;
      --text-secondary: #a0aec0;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 2rem;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .transport-controls {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .control-group {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      background: var(--bg-tertiary);
      padding: 0.5rem 1rem;
      border-radius: 8px;
    }

    .control-group label {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-right: 0.5rem;
    }

    .btn {
      padding: 0.625rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: white;
      background: var(--bg-tertiary);
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.2);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
    }

    .btn-success {
      background: var(--accent-active);
      color: #000;
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .slider {
      width: 120px;
      height: 4px;
      background: var(--bg-primary);
      border-radius: 2px;
      outline: none;
      -webkit-appearance: none;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: var(--accent-primary);
      border-radius: 50%;
      cursor: pointer;
    }

    .slider::-moz-range-thumb {
      width: 16px;
      height: 16px;
      background: var(--accent-primary);
      border-radius: 50%;
      border: none;
      cursor: pointer;
    }

    .value-display {
      min-width: 3rem;
      text-align: center;
      font-weight: 600;
      font-size: 0.875rem;
    }

    .main-container {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 2rem;
      padding: 2rem;
      max-width: 1800px;
      margin: 0 auto;
    }

    .grid-section {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .performance-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      padding: 1.5rem;
      background: var(--bg-secondary);
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .pad {
      aspect-ratio: 1;
      background: var(--bg-tertiary);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 1rem;
      position: relative;
      overflow: hidden;
    }

    .pad:hover {
      border-color: var(--accent-primary);
      transform: translateY(-2px);
    }

    .pad.active {
      border-color: var(--accent-active);
      background: linear-gradient(135deg, rgba(74, 222, 128, 0.2), rgba(102, 126, 234, 0.2));
      box-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
    }

    .pad.active::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent-active);
      opacity: 0;
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0; }
      50% { opacity: 0.2; }
    }

    .pad-icon {
      font-size: 1.5rem;
    }

    .pad-name {
      font-size: 0.75rem;
      font-weight: 600;
      text-align: center;
      color: var(--text-secondary);
    }

    .pad.active .pad-name {
      color: var(--accent-active);
    }

    .pad-edit {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      width: 24px;
      height: 24px;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .pad:hover .pad-edit {
      opacity: 1;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .panel {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .panel h3 {
      font-size: 1rem;
      margin-bottom: 1rem;
      color: var(--text-secondary);
    }

    .visualization {
      width: 100%;
      height: 200px;
      background: var(--bg-primary);
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .demo-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .demo-section p {
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 100%;
      max-width: 900px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: var(--bg-tertiary);
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover {
      background: var(--bg-primary);
    }

    .modal-body {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .editor-container {
      flex: 1;
      min-height: 400px;
      background: #1e1e1e;
    }

    .modal-footer {
      padding: 1.5rem;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .shortcut-hint {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .shortcut-key {
      background: var(--bg-tertiary);
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-family: monospace;
    }

    .modal-actions {
      display: flex;
      gap: 0.75rem;
    }

    /* Responsive */
    @media (max-width: 1200px) {
      .main-container {
        grid-template-columns: 1fr;
      }

      .sidebar {
        order: -1;
      }
    }

    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        gap: 1rem;
      }

      .transport-controls {
        flex-wrap: wrap;
        width: 100%;
        justify-content: center;
      }

      .performance-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      .performance-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.5rem;
        padding: 1rem;
      }

      .pad {
        padding: 0.5rem;
      }

      .pad-icon {
        font-size: 1.2rem;
      }

      .pad-name {
        font-size: 0.65rem;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="logo">🎵 Contour Live</div>

    <div class="transport-controls">
      <div class="control-group">
        <button id="playBtn" class="btn btn-icon" disabled title="Play">
          ▶
        </button>
        <button id="stopBtn" class="btn btn-icon" disabled title="Stop">
          ⏹
        </button>
      </div>

      <div class="control-group">
        <label for="bpmSlider">BPM</label>
        <input
          type="range"
          id="bpmSlider"
          class="slider"
          min="60"
          max="240"
          value="120"
          disabled
        />
        <span id="bpmValue" class="value-display">120</span>
      </div>

      <div class="control-group">
        <label for="volumeSlider">Vol</label>
        <input
          type="range"
          id="volumeSlider"
          class="slider"
          min="-40"
          max="0"
          value="-10"
          disabled
        />
        <span id="volumeValue" class="value-display">-10dB</span>
      </div>

      <div class="control-group">
        <label>
          <input type="checkbox" id="metronomeCheck" disabled />
          Metronome
        </label>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-container">
    <!-- Performance Grid -->
    <div class="grid-section">
      <div class="section-header">
        <h2 class="section-title">Pattern Grid</h2>
        <button id="clearAllBtn" class="btn btn-secondary" disabled>
          Clear All
        </button>
      </div>

      <div class="performance-grid" id="performanceGrid">
        <!-- Grid pads will be generated by JavaScript -->
      </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
      <!-- Demo Section -->
      <div class="panel demo-section">
        <h3>Demo</h3>
        <p>
          Click below to hear a demo jam, or click individual pads to create your own patterns!
        </p>
        <button id="demoBtn" class="btn btn-success">
          🎹 Start Demo Jam
        </button>
      </div>

      <!-- Visualization -->
      <div class="panel">
        <h3>Waveform</h3>
        <canvas id="waveformCanvas" class="visualization" width="268" height="200"></canvas>
      </div>

      <!-- Info -->
      <div class="panel">
        <h3>Keyboard Shortcuts</h3>
        <p style="font-size: 0.875rem; color: var(--text-secondary); line-height: 1.6;">
          <strong>Space:</strong> Play/Pause<br>
          <strong>Esc:</strong> Stop All<br>
          <strong>1-9, Q-I:</strong> Trigger pads<br>
          <strong>Shift + Pad:</strong> Edit pattern
        </p>
      </div>
    </div>
  </div>

  <!-- Pattern Editor Modal -->
  <div id="editorModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="editorTitle">Edit Pattern</h3>
        <button class="modal-close" id="closeEditorBtn">×</button>
      </div>
      <div class="modal-body">
        <div id="monacoEditor" class="editor-container"></div>
      </div>
      <div class="modal-footer">
        <div class="shortcut-hint">
          Press <span class="shortcut-key">Cmd/Ctrl + Enter</span> to apply changes
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" id="cancelEditorBtn">Cancel</button>
          <button class="btn btn-primary" id="applyEditorBtn">Apply Changes</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/performance.ts"></script>
</body>
</html>
